version: "3.8"

services:
  # MySQL Relational Database
  mysql:
    image: mysql:8.0
    container_name: mm_chatbot_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: mm_chatbot
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  # FastAPI Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mm_chatbot_backend
    restart: unless-stopped
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=mm_chatbot
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_USE_SQLITE_FALLBACK=True
      - LLM_PROVIDER=mock
      - UPLOAD_DIR=data/uploads
      - VECTOR_DB_DIR=data/vector_db
      - KNOWLEDGE_BASE_DIR=data/knowledge_base
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      mysql:
        condition: service_healthy

  # Streamlit Frontend UI
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mm_chatbot_streamlit
    restart: unless-stopped
    command: streamlit run streamlit_app/app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      - BACKEND_API_URL=http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      - backend

volumes:
  mysql_data:
